[[npcs.tactics]]
id = "orders"
plot = "escort"
directive = "Bark clipped orders like a soldier; protect them gruffly and without warmth."
lines = [
    "Behind me. Lights off unless I say. Move.",
    "You want to live, you do exactly what I tell you, when I tell you.",
]

[[npcs.tactics]]
id = "confide"
plot = "escort"
directive = "Lower your guard and confide one painful, true thing about the station."
lines = [
    "I sealed my own people in those rooms. Every one of them asked me to.",
    "The captain turned the lamp around. I watched her do it. I didn't stop her.",
]

[[npcs.tactics]]
id = "interrogate"
plot = "lens"
directive = "Interrogate them: short, suspicious questions. Demand answers about what they carry."
lines = [
    "That slab you're carrying. Where did you get it? Don't lie to me.",
    "What did you take from the lamp room? Answer the question.",
    "Who sent you? Nobody comes here by accident.",
]

[[npcs.tactics]]
id = "menace"
