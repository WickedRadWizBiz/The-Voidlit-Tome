# The Hollow Lantern: the first sector for the Voidlit Tome.
#
# The Hollow Lantern was a lighthouse-station, built to burn a lamp bright enough to guide ore haulers
# through the Dark Sector, where starlight goes missing. Forty days ago the lamp went out. The crew
# stopped answering, then started singing. You came aboard to strip the lamp's core for salvage.
# Your shuttle is gone. The Tome, a sliver of the lamp's lens that still remembers light, is the only
# light you have, and it has started to write.

[scenario]
id = "hollow_lantern"
title = "The Hollow Lantern"
per_act = 2
lumen_interval = 5
# Hidden check DCs for obstacles: dc_base + dc_per_act * act + dc_offset (+1 in the dark). The offset is the one
# global balance knob, fitted for brutal play (a sensible player escapes about one run in five).
dc_base = 12
dc_per_act = 2
dc_offset = -1
intro = """The Tome wakes under your hand: a slab of black glass, warm as skin. Words rise out of it in light. \
You are aboard the Hollow Lantern, a lighthouse-station adrift in the Dark Sector. Your shuttle tore loose \
an hour ago. The lifeboats are at the far end of the station. Between here and there is everything that \
put the lamp out."""
lore = [
    "The lamp didn't fail. Someone turned it toward the dark on purpose, and something on the other side looked back.",
    "The Choir isn't a cult. It's what's left of the crew, still on shift, still answering a signal from the black.",
    "The Tome you carry was cut from the lamp's lens. As long as it glows, the Choir can't quite see you.",
    "Every lifeboat but one was launched empty. The last one is locked to the Conductor's voice.",
]

