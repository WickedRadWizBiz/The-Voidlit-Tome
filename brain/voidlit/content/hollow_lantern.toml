attributes = { grit = 3, guile = 1, insight = 2, resolve = 3 }
color = "#ffb347"
aliases = ["marcus", "hale", "warden", "man"]
persona = "The station's warden. Believes everyone left alive is Choir-touched, himself included. Clipped, paranoid, decent underneath, armed."
trust = { elara = 0.35 }
reward = { rapport = 0.4, deception = -0.7, exposure = -0.3, aggression = -0.2 }

[[npcs.plots]]
id = "escort"
name = "Keep the stranger alive long enough to reach the lifeboats"
role = "ally"
momentum = 0.3

[[npcs.plots]]
id = "lens"
name = "Find out what the stranger took from the lamp room"
role = "extract"
momentum = 0.45

[[npcs.plots]]
id = "seal"
name = "Seal the stranger in quarantine before the Choir can use them"
role = "betray"
