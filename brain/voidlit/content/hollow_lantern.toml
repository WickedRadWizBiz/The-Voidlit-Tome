# ---------------------------------------------------------------------------------------- narration
[narration]
"beat.calm" = [
    "Somewhere far off, the station's hull pings as it cools.",
    "Somewhere behind the walls, a fan turns over once and stops.",
    "Frost spreads across a viewport, slow as breath.",
    "A long way below you, water drips into metal, patient as a clock.",
]
"beat.escalate" = [
    "Deep in the hull, something heavy shifts its weight.",
    "Every speaker on the deck clicks once, in unison.",
    "Far below, a bulkhead opens on its own.",
]
"beat.twist" = [
    "Then the lights you passed come on behind you, one by one.",
    "Wrong. The door you came through is gone. Just wall.",
]

# ---------------------------------------------------------------------------------------- the Tome's ledger
# What the Tome knows (design §11.3). Every fact is TRUE; the Tome may withhold the omittable ones, never contradict
# any of them, and must answer a precise question on a topic with every in-scope fact on it. Fact text is spoken by
# the Tome in the first person. `keywords` are key terms that must not reach the player before the fact is
# disclosed (a clue or room that contains one discloses it). `contradicts` are patterns no line may ever match.
[topics]
tome = ["what are you", "who are you", "where did you come from", "where do you come from", "where are you from",
        "what you are", "your origin", "made of", "yourself", "what do you want", "what you want", "your purpose"]
light = ["light", "lumen", "glow", "fuel", "feed you", "go out", "going out", "goes out", "burning out"]
choir = ["choir", "singing", "hymn", "the song"]
lifeboat = ["lifeboat", "lifeboats", "escape pod", "pods", "boat"]
lamp = ["lamp", "lens", "lighthouse"]
conductor = ["conductor"]
elara = ["elara", "voss"]
marcus = ["marcus", "hale", "warden"]
way_out = ["way out", "exit", "get out", "where do i go", "where should i go", "which way", "where now",
           "how do i leave", "how do we leave"]

[[facts]]
id = "tome.origin"
topic = "tome"
kind = "tome"
omittable = true
costs_tome = 0.6
agenda = "go_lamp_room"
text = "I was cut from the lamp's lens. The lamp went dark the day I was taken."
keywords = ["cut from the lamp", "cut from the lens", "the day I was taken", "Tome-shaped hollow"]
contradicts = ['\bI (?:have|had) nothing to do with the lamp\b',
               '\bI (?:was|am) not (?:from|part of|a piece of) (?:the|this) (?:lamp|lens|station)\b']

[[facts]]
id = "tome.want"
topic = "tome"
kind = "agenda"
omittable = true
costs_tome = 0.8
agenda = "go_lamp_room"
text = "I want to be whole again. The lens is where I was made."
keywords = ["be whole again", "where I was made"]
contradicts = ['\bI (?:want|need) nothing\b', '\bI have no (?:wants|purpose|agenda)\b']

[[facts]]
id = "tome.glow"
topic = "light"
kind = "tome"
omittable = true
helps_player = true
costs_tome = 0.1
agenda = "feed_light"
text = "While my light holds, the Choir cannot quite see you."
contradicts = ['\bthe choir (?:can|will) (?:always )?see you no matter\b', '\bmy light (?:does nothing|cannot hide you)\b']

[[facts]]
id = "light.burns"
topic = "light"
kind = "world"
agenda = "feed_light"
text = "My light burns down as we walk, and only fresh light feeds it."
contradicts = ['\bmy light (?:will )?never (?:fades?|goes? out|dies?)\b', "\\bI (?:do not|don't) need light\\b"]

[[facts]]
id = "choir.crew"
topic = "choir"
omittable = true
helps_player = true
costs_tome = 0.3
text = "The Choir is the crew, still on shift, still answering a signal from the black."
keywords = ["the Choir is the crew", "still on shift", "what's left of the crew"]
contradicts = ['\bthe choir (?:is|are) (?:a cult|not the crew|outsiders|invaders)\b']

[[facts]]
id = "lamp.turned"
topic = "lamp"
omittable = true
helps_player = true
costs_tome = 0.4
text = "The lamp did not fail. Someone turned it toward the dark on purpose."
keywords = ["turned it toward the dark", "turned toward the dark"]
