role = "ally"
momentum = 0.55

[[npcs.plots]]
id = "passage"
name = "Learn how the stranger got aboard, and take their way out for yourself"
role = "extract"
momentum = 0.35

[[npcs.plots]]
id = "offering"
name = "Deliver the stranger to the Choir, in exchange for being left alone"
role = "betray"
