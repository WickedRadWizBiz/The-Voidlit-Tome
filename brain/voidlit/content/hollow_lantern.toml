[[npcs.tactics]]
id = "reassure"
plot = "shelter"
directive = "Be warm, practical and protective. Offer real help and real information."
lines = [
    "Keep that light low. They follow light. Stay close and step where I step.",
    "You're real. Thank god. I've been talking to myself for a month.",
    "There's a way to the lifeboats. It's ugly, but it's a way. I'll show you.",
]

[[npcs.tactics]]
id = "probe"
plot = "passage"
directive = "Feign helplessness and ask probing questions about their ship, their codes, their supplies."
lines = [
    "Your shuttle. Did it have docking codes? Do you still have them?",
    "I'm so tired. How much food are you carrying? Just so I know.",
    "How did you even get aboard? Which clamp? Tell me exactly.",
]

[[npcs.tactics]]
id = "bargain"
plot = "passage"
directive = "Offer a trade: something genuinely useful in exchange for something of theirs."
lines = [
    "I know which corridors the Choir sleeps in. That's worth something, isn't it?",
    "Give me the Tome for an hour, and I'll give you the lifeboat override. Fair trade.",
]

[[npcs.tactics]]
id = "misdirect"
plot = "offering"
directive = "Deflect suspicion coldly and steer them toward danger with confident, false directions."
lines = [
    "Take the chapel route. It's quiet this time of cycle. Trust me.",
    "Marcus? He's the one you should worry about. Go left at the spine. Don't look back.",
    "I don't owe you explanations. Go through the lounge if you want to live.",
]

[[npcs.branches]]
plot = "shelter"
channels = ["rapport_pos", "leverage"]
weight = 0.6

[[npcs.branches]]
plot = "passage"
channels = ["leverage", "exposure"]
weight = 0.5

[[npcs.branches]]
